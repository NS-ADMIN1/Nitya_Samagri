name: 🛠️ Manual · Mail (Gmail SMTP)

# Run by hand only: Actions → "🛠️ Manual · Mail (Gmail SMTP)" → Run workflow.
# Use it when customers or staff do not receive e-mails from the store.
#
#   check-login     logs in to Gmail with the address and App Password the
#                   live API is using — sends nothing
#   send-test-mail  also sends one short test mail to the address you type
#
# Nothing on the server is changed. The password is never printed.
# This repository is public, so the address you type in 'to' can be read in
# the run log — use a business address.
#
# If the login is refused: make a new App Password at
# https://myaccount.google.com/apppasswords (2-Step Verification must be on),
# put it in backend/.env on the server as GMAIL_APP_PASSWORD, then restart
# the API with Manual · Docker (action restart, service api). Put the same
# value in the GitHub secret GMAIL_APP_PASSWORD, which the Integration Check
# uses for its report mails.
#
# Secrets used: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: check-login
        options: [check-login, send-test-mail]
      to:
        description: "Only for send-test-mail — who gets the test mail"
        default: "admin@nityasamagri.in"

run-name: "Mail · ${{ inputs.action }}"

permissions:
  contents: read

# One manual tool at a time on the server.
concurrency:
  group: manual-server-tools
  cancel-in-progress: false

jobs:
  mail:
    name: ✉️ Mail · ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect to the server
        env:
          SERVER_HOST:    ${{ secrets.SERVER_HOST }}
          SERVER_USER:    ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "❌ Add SERVER_HOST, SERVER_USER and SERVER_SSH_KEY to the repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key && chmod 600 ~/.ssh/server_key
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/server_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh server true && echo "✅ Connected to the server."

      - name: Mail — ${{ inputs.action }}
        env:
          ACTION:  ${{ inputs.action }}
          MAIL_TO: ${{ inputs.to }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ACTION" = "send-test-mail" ] && ! [[ "$MAIL_TO" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "❌ For send-test-mail, type one valid e-mail address in 'to'."
            exit 1
          fi

          {
            printf 'export ACTION=%q MAIL_TO=%q RUN_URL=%q\n' "$ACTION" "$MAIL_TO" "$RUN_URL"
            cat <<'REMOTE'
          set -uo pipefail
          failed=0
          ok()      { printf '  [ OK ]     %-20s %s\n' "$1" "$2"; }
          bad()     { printf '  [ FAILED ] %-20s %s\n' "$1" "$2"; failed=$((failed + 1)); }
          info()    { printf '  [ INFO ]   %-20s %s\n' "$1" "$2"; }
          section() { printf '\n%s\n' "$1"; }

          cd ~/Nitya_Samagri 2>/dev/null || { bad "Server" "folder ~/Nitya_Samagri not found"; exit 1; }
          ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
          API="nityasamagri_api_$ACTIVE"

          section "GMAIL SMTP (the account the live API is using)"

          if [ "$(docker inspect -f '{{.State.Status}}' "$API" 2>/dev/null)" != "running" ]; then
            bad "API container" "$API is not running, so its mail settings cannot be tested"
            echo "             Start it first with Manual · Docker (action restart, service api)."
            exit 1
          fi
          if ! command -v curl > /dev/null 2>&1; then
            bad "Server" "the 'curl' program is not installed on the server"
            exit 1
          fi

          GMAIL_USER=$(docker exec "$API" printenv GMAIL_USER 2>/dev/null || true)
          GMAIL_PASS=$(docker exec "$API" printenv GMAIL_APP_PASSWORD 2>/dev/null || true)
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_PASS" ]; then
            bad "Settings" "GMAIL_USER / GMAIL_APP_PASSWORD are not set in backend/.env — the store sends no mail"
            exit 1
          fi

          # The login details go to curl on its input, never on the command
          # line, so they cannot be seen in the server's process list.
          smtp() {
            printf 'user = "%s:%s"\n' "$GMAIL_USER" "$GMAIL_PASS" \
              | curl -sS --max-time 30 --url "smtps://smtp.gmail.com:465" -K - "$@" 2>&1
          }

          if out=$(smtp -o /dev/null); then
            ok  "Login to Gmail" "accepted"
          else
            case "$out" in
              *"(67)"*) bad "Login to Gmail" "REFUSED — the App Password is wrong or was removed (steps are at the top of this workflow file)" ;;
              *)        bad "Login to Gmail" "could not reach smtp.gmail.com: ${out:-no answer}" ;;
            esac
            exit 1
          fi

          if [ "$ACTION" = "send-test-mail" ]; then
            section "TEST MAIL"
            mail=$(mktemp)
            {
              echo "From: Nitya Samagri <${GMAIL_USER}>"
              echo "To: ${MAIL_TO}"
              echo "Subject: [Nitya Samagri] Test mail - mail sending works"
              echo "Date: $(date -R)"
              echo "MIME-Version: 1.0"
              echo "Content-Type: text/plain; charset=UTF-8"
              echo
              echo "This is a test mail from the Nitya Samagri server."
              echo "If you are reading it, the store can send e-mail."
              echo
              echo "Sent at: $(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')"
              echo "Started from: ${RUN_URL}"
            } > "$mail"

            if out=$(smtp --crlf --mail-from "$GMAIL_USER" --mail-rcpt "$MAIL_TO" --upload-file "$mail"); then
              ok   "Test mail" "sent — it should arrive within a minute"
              info "If it is missing" "look in the Spam folder of the address you typed"
            else
              bad  "Test mail" "Gmail did not accept it: ${out:-no answer}"
            fi
            rm -f "$mail"
          fi

          [ "$failed" -eq 0 ]
          REMOTE
          } | ssh server bash -s 2>&1 | tee report.txt

      - name: Show the report
        if: always()
        run: |
          {
            echo '### Mail (Gmail SMTP)'
            echo '```'
            cat report.txt 2>/dev/null || echo "No report — open the log of the step above."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

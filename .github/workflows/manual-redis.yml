name: 🛠️ Manual · Redis

# Run by hand only: Actions → "🛠️ Manual · Redis" → Run workflow.
# Use it when the Integration Check mail says "Redis cache" failed, or when
# the website shows old product data.
#
#   check                look only — ping, memory, how many keys
#   clear-product-cache  delete cached product pages             (needs CONFIRM)
#   clear-all-cache      delete every cached item                (needs CONFIRM)
#   restart              restart the Redis container             (needs CONFIRM)
#
# A fix always runs the check first. Without CONFIRM typed in the confirm
# box it stops after the check and changes nothing.
#
# Clearing the cache never logs anyone out: saved logins (refresh:*) and
# login locks are left alone. The cache fills itself again on the next visit.
#
# Secrets used: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: check
        options: [check, clear-product-cache, clear-all-cache, restart]
      confirm:
        description: "Type CONFIRM to allow clear / restart"
        default: ""

run-name: "Redis · ${{ inputs.action }}"

permissions:
  contents: read

# One manual tool at a time on the server.
concurrency:
  group: manual-server-tools
  cancel-in-progress: false

jobs:
  redis:
    name: 🧠 Redis · ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect to the server
        env:
          SERVER_HOST:    ${{ secrets.SERVER_HOST }}
          SERVER_USER:    ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "❌ Add SERVER_HOST, SERVER_USER and SERVER_SSH_KEY to the repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key && chmod 600 ~/.ssh/server_key
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/server_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh server true && echo "✅ Connected to the server."

      - name: Redis — ${{ inputs.action }}
        env:
          ACTION:  ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          {
            printf 'export ACTION=%q CONFIRM=%q\n' "$ACTION" "$CONFIRM"
            cat <<'REMOTE'
          set -uo pipefail
          failed=0
          ok()      { printf '  [ OK ]     %-20s %s\n' "$1" "$2"; }
          bad()     { printf '  [ FAILED ] %-20s %s\n' "$1" "$2"; failed=$((failed + 1)); }
          info()    { printf '  [ INFO ]   %-20s %s\n' "$1" "$2"; }
          section() { printf '\n%s\n' "$1"; }

          cd ~/Nitya_Samagri 2>/dev/null || { bad "Server" "folder ~/Nitya_Samagri not found"; exit 1; }
          ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
          API="nityasamagri_api_$ACTIVE"
          R="nityasamagri_redis"

          state() {
            local s
            s=$(docker inspect -f '{{.State.Status}}{{if .State.Health}} {{.State.Health.Status}}{{end}}' "$1" 2>/dev/null | head -n 1)
            echo "${s:-missing}"
          }
          wait_up() {
            local i
            for i in $(seq 1 30); do
              case "$(state "$1")" in running|"running healthy") return 0 ;; esac
              sleep 3
            done
            return 1
          }
          # A fix is only allowed with CONFIRM typed in the confirm box.
          need_confirm() {
            [ "$CONFIRM" = "CONFIRM" ] && return 0
            section "NOT DONE"
            echo "  '$ACTION' changes the live server, so nothing was changed."
            echo "  To allow it, run again and type CONFIRM in the confirm box."
            exit 1
          }

          # The password Redis was started with (never printed).
          PASS=$(docker inspect -f '{{range .Config.Cmd}}{{println .}}{{end}}' "$R" 2>/dev/null \
                   | awk 'prev == "--requirepass" { print; exit } { prev = $0 }')
          rcli()  { REDISCLI_AUTH="$PASS" docker exec -e REDISCLI_AUTH "$R" redis-cli "$@" 2>&1 | tr -d '\r'; }
          field() { rcli info "$1" | awk -F: -v key="$2" '$1 == key { print $2 }'; }
          count() { rcli --scan --pattern "$1" | wc -l | tr -d ' '; }

          # What the running API itself says about a service (its /system/health).
          api_sees() {
            local out detail
            out=$(docker exec -e NAME="$2" "$API" node -e '
              fetch("http://localhost:" + (process.env.PORT || 4000) + "/api/v1/system/health?verbose=1")
                .then((r) => r.json())
                .then((j) => {
                  const c = (j.checks || []).find((x) => x.name === process.env.NAME);
                  if (!c) return console.log("fail|not in the API health report");
                  console.log(c.status + "|" + (c.message || (c.latencyMs != null ? c.latencyMs + " ms" : "")));
                })
                .catch((e) => console.log("fail|the API did not answer: " + e.message));' 2>/dev/null) \
              || out="fail|API container $API is not running"
            detail="${out#*|}"
            case "${out%%|*}" in
              ok) ok  "$1" "working${detail:+ ($detail)}" ;;
              *)  bad "$1" "${detail:-failed}" ;;
            esac
          }

          check() {
            section "REDIS"
            case "$(state "$R")" in
              running|"running healthy") ok "Container" "$(state "$R")" ;;
              *) bad "Container" "$(state "$R")  (container $R)"; return ;;
            esac

            pong=$(rcli ping)
            if [ "$pong" = "PONG" ]; then
              ok  "Ping" "answers"
            else
              bad "Ping" "${pong:-no answer}"
              return
            fi

            info "Memory"         "$(field memory used_memory_human) used, limit $(field memory maxmemory_human)"
            info "Running for"    "$(field server uptime_in_days) day(s)"
            info "Dropped (full)" "$(field stats evicted_keys) key(s) removed because memory was full"
            if [ "$(field persistence aof_last_write_status)" = "ok" ]; then
              ok  "Saving to disk" "working"
            else
              bad "Saving to disk" "last write failed — check the disk with Manual · Docker"
            fi

            section "WHAT IS STORED"
            info "All keys"       "$(rcli dbsize)"
            info "Product cache"  "$(count 'products:*')"
            info "Other cache"    "$(( $(count 'categories:*') + $(count 'users:id:*') + $(count 'coupons:*') + $(count 'orders:stats') ))"
            info "Saved logins"   "$(count 'refresh:*')  (never cleared by this workflow)"

            section "SEEN FROM THE API"
            api_sees "Redis cache" redis
          }

          clear_keys() {
            local n; n=$(count "$1")
            rcli --scan --pattern "$1" \
              | REDISCLI_AUTH="$PASS" docker exec -i -e REDISCLI_AUTH "$R" xargs -r -n 200 redis-cli unlink > /dev/null
            info "Cleared" "$n key(s)  ($1)"
          }

          check

          case "$ACTION" in
            clear-product-cache)
              need_confirm
              section "CLEAR PRODUCT CACHE"
              clear_keys 'products:*'
              ok "Product cache" "cleared — it fills again on the next visit"
              ;;

            clear-all-cache)
              need_confirm
              section "CLEAR ALL CACHE (logins are kept)"
              for pattern in 'products:*' 'categories:*' 'users:id:*' 'coupons:*' 'orders:stats'; do
                clear_keys "$pattern"
              done
              ok "All cache" "cleared — it fills again on the next visit"
              ;;

            restart)
              need_confirm
              failed=0
              section "RESTART"
              if docker restart "$R" > /dev/null 2>&1 && wait_up "$R" && [ "$(rcli ping)" = "PONG" ]; then
                ok  "Redis" "restarted and answering"
                api_sees "Redis cache" redis
              else
                bad "Redis" "did not come back: $(state "$R") — use Manual · Docker, action 'logs', service 'redis'"
              fi
              ;;
          esac

          [ "$failed" -eq 0 ]
          REMOTE
          } | ssh server bash -s 2>&1 | tee report.txt

      - name: Show the report
        if: always()
        run: |
          {
            echo '### Redis'
            echo '```'
            cat report.txt 2>/dev/null || echo "No report — open the log of the step above."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

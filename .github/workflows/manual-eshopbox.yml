name: 🛠️ Manual · Eshopbox

# Run by hand only: Actions → "🛠️ Manual · Eshopbox" → Run workflow.
# Use it when paid orders do not reach Eshopbox, or delivery status does
# not update on the website.
#
# It tests, with the settings the live API is using:
#   • the Eshopbox API token (a real, read-only call — no order is made)
#   • that the delivery-update webhook address answers and refuses a wrong
#     secret
#
# It only looks. Nothing is changed and no token value is printed.
#
# To change the token: edit backend/.env on the server, then restart the API
# with Manual · Docker (action restart, service api).
#
# Secrets used: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY

on:
  workflow_dispatch:

run-name: "Eshopbox · check"

permissions:
  contents: read

# One manual tool at a time on the server.
concurrency:
  group: manual-server-tools
  cancel-in-progress: false

env:
  API_URL: https://api.adminns.in

jobs:
  eshopbox:
    name: 📦 Eshopbox · check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect to the server
        env:
          SERVER_HOST:    ${{ secrets.SERVER_HOST }}
          SERVER_USER:    ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "❌ Add SERVER_HOST, SERVER_USER and SERVER_SSH_KEY to the repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key && chmod 600 ~/.ssh/server_key
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/server_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh server true && echo "✅ Connected to the server."

      - name: Eshopbox — check
        run: |
          {
            printf 'export API_URL=%q\n' "$API_URL"
            cat <<'REMOTE'
          set -uo pipefail
          cd ~/Nitya_Samagri 2>/dev/null || { echo "  [ FAILED ] Server               folder ~/Nitya_Samagri not found"; exit 1; }
          ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
          API="nityasamagri_api_$ACTIVE"

          if [ "$(docker inspect -f '{{.State.Status}}' "$API" 2>/dev/null)" != "running" ]; then
            echo "  [ FAILED ] API container        $API is not running, so its settings cannot be tested."
            echo "             Start it first with Manual · Docker (action restart, service api)."
            exit 1
          fi

          # Runs inside the live API container, so it uses exactly the token
          # the store is using right now.
          docker exec -i -e API_URL "$API" node - <<'JS'
          let failed = 0;
          const row     = (tag, name, text) => console.log(`  ${tag.padEnd(10)} ${name.padEnd(20)} ${text}`);
          const ok      = (name, text) => row("[ OK ]", name, text);
          const bad     = (name, text) => { row("[ FAILED ]", name, text); failed++; };
          const section = (title) => console.log(`\n${title}`);

          const { ESHOPBOX_API_TOKEN: token, ESHOPBOX_EXTERNAL_CHANNEL_ID: channelId,
                  ESHOPBOX_WEBHOOK_SECRET: webhookSecret, API_URL } = process.env;
          const send = (url, init = {}) => fetch(url, { ...init, signal: AbortSignal.timeout(20000) });

          async function check() {
            section("ESHOPBOX (the settings the live API is using)");
            if (channelId) ok("Channel id", "set");
            else           bad("Channel id", "ESHOPBOX_EXTERNAL_CHANNEL_ID is not set in backend/.env — orders cannot be sent");

            if (!token) {
              bad("API token", "ESHOPBOX_API_TOKEN is not set in backend/.env — orders cannot be sent");
            } else {
              // Asks Eshopbox for an order that does not exist: the same call
              // the API uses to track an order (eshopbox.service.ts). Only the
              // token matters here — "not found" is the expected answer.
              try {
                const res = await send("https://wms.eshopbox.com/api/order/manual-check-not-an-order", {
                  headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                });
                if (res.status === 401 || res.status === 403) bad("API token", `Eshopbox REFUSED the token (HTTP ${res.status}) — make a new one in the Eshopbox workspace settings`);
                else if (res.status >= 500)                   bad("Eshopbox server", `server error at Eshopbox (HTTP ${res.status}) — not a problem on our side`);
                else                                          ok("API token", `accepted by Eshopbox (HTTP ${res.status})`);
              } catch (e) {
                bad("Eshopbox server", `no answer from wms.eshopbox.com (${e.message})`);
              }
            }

            section("DELIVERY-UPDATE WEBHOOK (how Eshopbox tells the store 'shipped / delivered')");
            if (webhookSecret) ok("Webhook secret", "set — it must be the same as in the Eshopbox webhook settings");
            else               bad("Webhook secret", "ESHOPBOX_WEBHOOK_SECRET is not set, so every delivery update is refused");

            // A message with a wrong secret must be refused (HTTP 403).
            const url = `${API_URL}/api/v1/integrations/shipping/webhook`;
            try {
              const res = await send(url, {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-webhook-secret": "manual-check-wrong-secret" },
                body: "{}",
              });
              if (res.status === 403)                         ok("Webhook address", `answers and refuses a wrong secret (${url})`);
              else if (res.status >= 200 && res.status < 300) bad("Webhook address", "ACCEPTED a wrong secret — anyone could change delivery status");
              else                                            bad("Webhook address", `HTTP ${res.status} from ${url}`);
            } catch (e) {
              bad("Webhook address", `no answer from ${url} (${e.message})`);
            }
          }

          check()
            .catch((e) => bad("Eshopbox", e.message))
            .finally(() => process.exit(failed ? 1 : 0));
          JS
          REMOTE
          } | ssh server bash -s 2>&1 | tee report.txt

      - name: Show the report
        if: always()
        run: |
          {
            echo '### Eshopbox'
            echo '```'
            cat report.txt 2>/dev/null || echo "No report — open the log of the step above."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

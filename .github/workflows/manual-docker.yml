name: 🛠️ Manual · Docker

# Run by hand only: Actions → "🛠️ Manual · Docker" → Run workflow.
# Use it when the Integration Check mail says a server or container is down.
#
#   check             look only — container status, disk and memory
#   logs              look only — last lines of one service's log
#   restart           restart one service              (needs CONFIRM)
#   clean-old-images  free disk space, runs cleanup.sh (needs CONFIRM)
#
# A fix always runs the check first. Without CONFIRM typed in the confirm
# box it stops after the check and changes nothing.
#
# api / web / admin always mean the LIVE colour (blue or green).
#
# This repository is public, so the run log is public too. Log lines are
# printed with e-mail addresses, long numbers and tokens hidden.
#
# Secrets used: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: check
        options: [check, logs, restart, clean-old-images]
      service:
        description: "Service — only for logs and restart"
        type: choice
        default: api
        options: [api, web, admin, nginx, redis, mongodb]
      lines:
        description: "Log lines to show — only for logs (1 to 1000)"
        default: "100"
      confirm:
        description: "Type CONFIRM to allow restart / clean-old-images"
        default: ""

run-name: "Docker · ${{ inputs.action }}"

permissions:
  contents: read

# One manual tool at a time on the server.
concurrency:
  group: manual-server-tools
  cancel-in-progress: false

jobs:
  docker:
    name: 🐳 Docker · ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Connect to the server
        env:
          SERVER_HOST:    ${{ secrets.SERVER_HOST }}
          SERVER_USER:    ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "❌ Add SERVER_HOST, SERVER_USER and SERVER_SSH_KEY to the repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server_key && chmod 600 ~/.ssh/server_key
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SERVER_HOST
            User $SERVER_USER
            IdentityFile ~/.ssh/server_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh server true && echo "✅ Connected to the server."

      - name: Docker — ${{ inputs.action }}
        env:
          ACTION:  ${{ inputs.action }}
          SERVICE: ${{ inputs.service }}
          LOG_LINES: ${{ inputs.lines }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if ! [[ "$LOG_LINES" =~ ^[0-9]{1,4}$ ]] || [ "$LOG_LINES" -lt 1 ] || [ "$LOG_LINES" -gt 1000 ]; then
            echo "❌ 'lines' must be a number from 1 to 1000."
            exit 1
          fi

          {
            printf 'export ACTION=%q SERVICE=%q LOG_LINES=%q CONFIRM=%q\n' "$ACTION" "$SERVICE" "$LOG_LINES" "$CONFIRM"
            cat <<'REMOTE'
          set -uo pipefail
          failed=0
          ok()      { printf '  [ OK ]     %-20s %s\n' "$1" "$2"; }
          bad()     { printf '  [ FAILED ] %-20s %s\n' "$1" "$2"; failed=$((failed + 1)); }
          info()    { printf '  [ INFO ]   %-20s %s\n' "$1" "$2"; }
          section() { printf '\n%s\n' "$1"; }

          cd ~/Nitya_Samagri 2>/dev/null || { bad "Server" "folder ~/Nitya_Samagri not found"; exit 1; }
          ACTIVE=$(cat .active_color 2>/dev/null || echo blue)
          [ "$ACTIVE" = "blue" ] && IDLE=green || IDLE=blue

          # "running", "running healthy", "exited", ... or "missing"
          state() {
            local s
            s=$(docker inspect -f '{{.State.Status}}{{if .State.Health}} {{.State.Health.Status}}{{end}}' "$1" 2>/dev/null | head -n 1)
            echo "${s:-missing}"
          }
          must_run() {
            local s; s=$(state "$2")
            case "$s" in
              running|"running healthy") ok  "$1" "$s" ;;
              *)                         bad "$1" "$s  (container $2)" ;;
            esac
          }
          wait_up() {
            local i
            for i in $(seq 1 30); do
              case "$(state "$1")" in running|"running healthy") return 0 ;; esac
              sleep 3
            done
            return 1
          }
          # A fix is only allowed with CONFIRM typed in the confirm box.
          need_confirm() {
            [ "$CONFIRM" = "CONFIRM" ] && return 0
            section "NOT DONE"
            echo "  '$ACTION' changes the live server, so nothing was changed."
            echo "  To allow it, run again and type CONFIRM in the confirm box."
            exit 1
          }
          # Hide personal details before a log line reaches the public run log.
          hide_private() {
            sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g
                    s/(Bearer|Basic) [A-Za-z0-9._~+\/=-]+/\1 [hidden]/g
                    s/\+?[0-9]{10,}/[number]/g'
          }

          case "$SERVICE" in
            api|web|admin) C="nityasamagri_${SERVICE}_${ACTIVE}" ;;
            *)             C="nityasamagri_${SERVICE}" ;;
          esac

          check() {
            section "LIVE SERVICES (live colour: $ACTIVE)"
            must_run "API"      "nityasamagri_api_$ACTIVE"
            must_run "Website"  "nityasamagri_web_$ACTIVE"
            must_run "Admin"    "nityasamagri_admin_$ACTIVE"
            must_run "Nginx"    "nityasamagri_nginx"
            must_run "Redis"    "nityasamagri_redis"
            must_run "MongoDB"  "nityasamagri_mongodb"

            section "STANDBY COLOUR ($IDLE) — not serving visitors"
            for svc in api web admin; do
              info "$svc" "$(state "nityasamagri_${svc}_$IDLE")"
            done

            section "SERVER"
            used=$(df -P / | awk 'NR==2 { gsub("%", "", $5); print $5 }')
            if [ "${used:-0}" -ge 90 ]; then
              bad "Disk" "${used}% full — run this workflow with clean-old-images"
            else
              ok  "Disk" "${used}% used"
            fi
            info "Memory" "$(free -m | awk '/^Mem:/ { printf "%d MB used of %d MB", $3, $2 }')"

            section "ALL CONTAINERS"
            docker ps -a --filter "name=nityasamagri" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          }

          case "$ACTION" in
            check)
              check
              ;;

            logs)
              section "LAST $LOG_LINES LOG LINES — $C (personal details hidden)"
              if [ "$(state "$C")" = "missing" ]; then
                bad "Logs" "container $C not found"
              else
                docker logs --tail "$LOG_LINES" "$C" 2>&1 | hide_private
              fi
              ;;

            restart)
              check
              need_confirm
              failed=0
              section "RESTART — $C"
              if docker restart "$C" > /dev/null 2>&1 && wait_up "$C"; then
                ok  "$SERVICE" "restarted, now $(state "$C")"
              else
                bad "$SERVICE" "did not come back: $(state "$C") — run again with action 'logs'"
              fi
              ;;

            clean-old-images)
              section "DISK BEFORE"
              df -h / | sed 's/^/  /'
              need_confirm
              section "CLEAN UP (devops/scripts/cleanup.sh)"
              if bash devops/scripts/cleanup.sh 2>&1 | sed 's/^/  /'; then
                ok  "Clean up" "done"
              else
                bad "Clean up" "cleanup.sh stopped with an error — see the lines above"
              fi
              section "DISK AFTER"
              df -h / | sed 's/^/  /'
              ;;
          esac

          [ "$failed" -eq 0 ]
          REMOTE
          } | ssh server bash -s 2>&1 | tee report.txt

      - name: Show the report
        if: always()
        run: |
          {
            echo '### Docker'
            echo '```'
            cat report.txt 2>/dev/null || echo "No report — open the log of the step above."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
